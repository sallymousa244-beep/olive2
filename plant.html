<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>زراعة شجرة الأمل</title>

    <link rel="stylesheet" href="plant.css">
</head>
<body>

    <main class="plant-scene">

        <div class="content">

            <h1>🌿 رحلتك تبدأ ببذرة</h1>

            <p id="welcomeText">
                استعد لزراعة شجرة الأمل
            </p>

            <div class="garden">

                <div class="seed" id="seed">🫘</div>

                <div class="sprout" id="sprout">🌱</div>

                <div class="soil"></div>

            </div>

            <p id="statusText">
                اضغط على الزر لزراعة بذرتك
            </p>

            <button id="growBtn">
                🌱 ازرع البذرة
            </button>

            <button id="nextBtn" hidden>
                الانتقال إلى التحدي الأول 
            </button>

        </div>

    </main>

    <script src="plant.js"></script>
    <footer class="grove-footer">
    <div class="footer-name">المعلمة سالي موسى العمرات BTEC IT</div><br>
    <div>مدرسة كفرسوم الثانوية الشاملة المختلطة</div><br>
    <div class="footer-year">2026</div>
</footer>

</body>
</html>
