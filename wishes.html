<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>شجرة الأمنيات للأردن 🇯🇴</title>

    <link rel="stylesheet" href="wishes.css">
</head>
<body>

<main class="wishes-page">

    <header class="wishes-header">
        <h1> شجرة الأمنيات للأردن </h1>
        <p>
            من أرض الزيتون نزرع الأمل
            ونكتب أمنياتنا لأردن أجمل
        </p>
    </header>

    <section class="wishes-scene">

        <div class="wishes-tree" id="wishesTree">
            <img src="wish-tree.jpg"
                 alt="شجرة الأمنيات للأردن">

            <div class="wish-leaves"
                 id="wishLeaves"></div>
        </div>

    </section>

    <section class="wish-form">

        <h2>✨ اترك أمنيتك للأردن</h2>

        <textarea
            id="wishInput"
            maxlength="150"
            placeholder="أتمنى للأردن..."
            rows="4"></textarea>

        <button id="saveWishBtn">
            🍃 علّق أمنيتي على الشجرة
        </button>

        <p id="wishMessage" aria-live="polite"></p>

    </section>

    <button type="button" class="back-btn" id="endJourneyBtn">
        انتهت رحلتك 
    </button>

</main>

<script type="module" src="wishes.js"></script>


</body>
</html>
